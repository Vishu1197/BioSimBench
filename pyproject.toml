[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "biosimbench"
version = "0.1.0"
description = "Lightweight GROMACS simulation quality-control and reporting tool"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
biosimbench = "biosimbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
